<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DECOJOLLY — Product Catalog</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#070b12;
      --text:#e8eefc;
      --muted:#9fb0d1;
      --gold:#d6b25e;
      --border:rgba(255,255,255,.10);
      --shadow: 0 10px 40px rgba(0,0,0,.55);
      --radius:18px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background:
        radial-gradient(900px 500px at 20% 10%, rgba(214,178,94,.18), transparent 60%),
        radial-gradient(900px 500px at 90% 20%, rgba(140,170,255,.16), transparent 55%),
        linear-gradient(180deg, var(--bg), #04060b 65%);
      color:var(--text);
    }
    a{color:inherit;text-decoration:none}
    .wrap{max-width:1100px;margin:0 auto;padding:28px 18px 60px}
    .top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 0 24px}
    .brand{display:flex;align-items:center;gap:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:800}
    .mark{
      width:38px;height:38px;border-radius:12px;
      background:linear-gradient(135deg, rgba(214,178,94,.95), rgba(140,170,255,.25));
      box-shadow: 0 0 0 1px rgba(214,178,94,.35) inset, var(--shadow);
    }
    .nav{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-weight:600}
    .nav a{padding:8px 10px;border-radius:12px;border:1px solid transparent}
    .nav a:hover{border-color:var(--border);background:rgba(255,255,255,.04);color:var(--text)}

    .panel{
      border:1px solid var(--border);
      background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
      border-radius:var(--radius);
      box-shadow: var(--shadow);
      padding:18px;
    }
    h1{margin:0 0 8px;font-size:28px}
    p{margin:0;color:var(--muted);line-height:1.7}
    .btn{
      display:inline-flex;align-items:center;gap:10px;
      padding:12px 14px;border-radius:14px;border:1px solid var(--border);
      background:rgba(255,255,255,.04);font-weight:700;margin-top:14px
    }
    .btn:hover{background:rgba(255,255,255,.06)}
    .btnGold{
      border-color:rgba(214,178,94,.55);
      background:linear-gradient(180deg, rgba(214,178,94,.25), rgba(214,178,94,.12))
    }
    .btnGold:hover{background:linear-gradient(180deg, rgba(214,178,94,.30), rgba(214,178,94,.14))}

    .pdfWrap{
      margin-top:14px;
      border:1px solid var(--border);
      border-radius:16px;
      overflow:hidden;
      background:rgba(0,0,0,.2)
    }
    iframe{width:100%;height:78vh;border:0}
    .hint{margin-top:10px;font-size:12px;color:rgba(159,176,209,.75)}
  </style>
</head>

<body>
  <div class="wrap">
    <header class="top">
      <div class="brand">
        <div class="mark" aria-hidden="true"></div>
        <div>DECOJOLLY</div>
      </div>
      <nav class="nav">
        <a href="./index.html">Home</a>
        <a href="./products.html">Product Catalog</a>
      </nav>
    </header>

    <div class="panel">
      <h1>Product Catalog</h1>
      <p>
        Download the catalog or preview it below. If you need pricing or lead time, please email us with item numbers.
      </p>

      <a class="btn btnGold" href="assets/docs/assets/docs/decojolly-product-catalog.pdf" target="_blank" rel="noopener">
        Download Catalog (PDF)
      </a>

      <div class="pdfWrap">
        <iframe src="assets/docs/assets/docs/decojolly-product-catalog.pdf"></iframe>
      </div>

      <div class="hint">
        If the preview does not load in some browsers, use the download button above.
      </div>
    </div>
  </div>
</body>
</html>
